<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Answer & Continue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP AD SLOT -->
  <div class="ad-box">AD SPACE</div>

  <div class="container">
    <h1 id="question">What feature do you value most in a smartphone?</h1>

    <textarea id="answer" placeholder="Type your answer here..." required></textarea>

    <!-- INLINE AD -->
    <div class="ad-box">AD SPACE</div>

    <button id="submitBtn" disabled>Submit Answer</button>

    <p id="status"></p>
  </div>

  <!-- FOOTER AD -->
  <div class="ad-box">AD SPACE</div>

  <script src="app.js"></script>
</body>
</html>
